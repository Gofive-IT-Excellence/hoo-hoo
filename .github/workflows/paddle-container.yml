name: OCR and document container check
on:
  push:
    branches: [main]
    paths: [Dockerfile, 'ocr-service/**', 'tests/**', 'package*.json', 'image-proofreader.js', 'script.js', 'ocr-word-locator-v2.js', '.github/workflows/paddle-container.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test contextual audit and occurrence mapping
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 -m pip install numpy==2.2.6
          python3 -m unittest discover -s ocr-service -p 'test_*.py'
      - name: Build bundled OCR image
        run: docker build -t hoo-hoo-paddle .
      - name: Verify offline startup, website and OCR
        run: |
          docker run -d --name hoo-test --network none hoo-hoo-paddle
          for attempt in $(seq 1 90); do
            if docker exec hoo-test python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ocr/health', timeout=5)"; then break; fi
            sleep 2
          done
          docker exec -i hoo-test python <<'PYTEST'
          import base64, io, json, urllib.request
          from PIL import Image, ImageDraw, ImageFont
          root = 'http://127.0.0.1:8080'
          health = json.load(urllib.request.urlopen(root + '/ocr/health', timeout=10))
          assert health['engine'] == 'openthai-ocr-text' and health['proofreading_ready'], health
          document_health = json.load(urllib.request.urlopen(root + '/document/health', timeout=10))
          assert document_health['engine'] == 'aksonocr-lite' and document_health['device'] == 'cpu', document_health
          html = urllib.request.urlopen(root).read().decode()
          assert 'ocr-word-locator-v2.js?v=' in html
          for module in ('pdf.mjs', 'pdf.worker.mjs'):
              with urllib.request.urlopen(root + '/vendor/pdfjs/' + module) as response:
                  assert response.headers.get_content_type() in ('application/javascript', 'text/javascript'), dict(response.headers)

          script = urllib.request.urlopen(root + '/script.js').read().decode()
          assert 'readPaddleImage' in script
          auditor = urllib.request.urlopen(root + '/image-proofreader.js').read().decode()
          assert 'HooHooImageAudit' in auditor
          model_health = json.load(urllib.request.urlopen(root + '/proofread/health'))
          assert model_health == {'configured': True, 'engine': 'local-llama.cpp', 'model': 'qwen3-8b'}, model_health
          buffer = io.BytesIO()
          image = Image.new('RGB', (320, 160), 'white')
          ImageDraw.Draw(image).text((20, 45), 'HELM TEST', font=ImageFont.load_default(size=42), fill='black')
          image.save(buffer, format='PNG')
          data = json.dumps({'base64': base64.b64encode(buffer.getvalue()).decode()}).encode()
          req = urllib.request.Request(root + '/ocr', data=data, headers={'Content-Type': 'application/json'})
          result = json.load(urllib.request.urlopen(req, timeout=180))
          assert (result['width'], result['height']) == (320, 160), result
          assert result['words'], result
          assert any(word['characters'] for word in result['words']), result
          # Scanned two-page PDF: document mode must use Akson with no network.
          pdf = io.BytesIO()
          image2 = Image.new('RGB', (640, 320), 'white')
          ImageDraw.Draw(image2).text((25, 90), 'SECOND PAGE', font=ImageFont.load_default(size=48), fill='black')
          image.save(pdf, format='PDF', save_all=True, append_images=[image2])
          boundary = 'hoo-document-test'
          body = (f'--{boundary}\r\nContent-Disposition: form-data; name="fileA"; filename="scan.pdf"\r\nContent-Type: application/pdf\r\n\r\n'.encode()
                  + pdf.getvalue() + f'\r\n--{boundary}--\r\n'.encode())
          req = urllib.request.Request(root + '/document/text', data=body,
              headers={'Content-Type': 'multipart/form-data; boundary=' + boundary})
          parsed_document = json.load(urllib.request.urlopen(req, timeout=180))
          assert parsed_document['engine'] == 'aksonocr-lite', parsed_document
          assert 'HELM' in parsed_document['text'] and 'SECOND' in parsed_document['text'], parsed_document

          data = json.dumps({'lines': [{'id': 7, 'text': 'บริษัทเปิดรับสมัครพนักงนใหม่'}, {'id': 8, 'text': 'ได้ สินเชื่อ'}]}).encode()
          req = urllib.request.Request(root + '/proofread', data=data, headers={'Content-Type': 'application/json'})
          audit = json.load(urllib.request.urlopen(req, timeout=150))
          assert audit['unchecked'] == [], audit
          by_id = {line['id']: line for line in audit['lines']}
          repaired = 'บริษัทเปิดรับสมัครพนักงนใหม่'
          for correction in by_id[7]['corrections']:
              repaired = repaired.replace(correction['wrong'], correction['correct'], 1)
          assert repaired == 'บริษัทเปิดรับสมัครพนักงานใหม่', audit
          assert by_id[8]['corrections'] == [], audit
          print('Offline OCR and local language model inference passed')
          PYTEST
      - name: Container logs
        if: always()
        run: docker logs hoo-test || true
